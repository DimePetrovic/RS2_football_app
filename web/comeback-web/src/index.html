<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Comeback</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The game is still yours.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#181B20">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .cb-splash {
      position: fixed; inset: 0;
      background: #181B20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px; z-index: 9999;
    }
    .cb-splash__logo {
      font-family: 'Oswald', sans-serif;
      font-size: 32px; font-weight: 700;
      color: #F5F5F5; letter-spacing: 3px;
    }
    .cb-splash__logo .colon { color: #C7F24E; }
    .cb-splash__spinner {
      width: 36px; height: 36px;
      border: 3px solid #3D424B;
      border-top-color: #C7F24E;
      border-radius: 50%;
      animation: cb-spin 0.8s linear infinite;
    }
    @keyframes cb-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <app-root>
    <div class="cb-splash">
      <div class="cb-splash__logo">COME<span class="colon">:</span>BACK</div>
      <div class="cb-splash__spinner"></div>
    </div>
  </app-root>
</body>
</html>
