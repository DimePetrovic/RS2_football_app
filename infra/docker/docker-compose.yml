services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_auth
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comeback_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-profile:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_profile
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comeback_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres-profile-data:/var/lib/postgresql/data
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_profile"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-match:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_match
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comeback_dev}
    ports:
      - "5436:5432"
    volumes:
      - postgres-match-data:/var/lib/postgresql/data
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_match"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-chat:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_chat
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comeback_dev}
    ports:
      - "5437:5432"
    volumes:
      - postgres-chat-data:/var/lib/postgresql/data
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_notification
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comeback_dev}
    ports:
      - "5435:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_notification"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-social:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_social
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comeback_dev}
    ports:
      - "5438:5432"
    volumes:
      - postgres-social-data:/var/lib/postgresql/data
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_social"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Message broker ───────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: comeback
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-comeback_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Cache ────────────────────────────────────────────────────

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - comeback-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Email (dev) ──────────────────────────────────────────────

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "comeback"
    ports:
      - "5341:5341"
      - "5342:80"
    volumes:
      - seq-data:/data
    networks:
      - comeback-network

  # ── .NET servisi ─────────────────────────────────────────────

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      JwtSettings__Secret: ${JWT_SECRET:-dev-secret-min-32-chars-comeback-auth-2026}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Services__AuthApi: http://auth-api:8080
      Services__ProfileApi: http://profile-api:8080
      Services__RatingApi: http://rating-api:8080
      Services__MatchApi: http://match-api:8080
      Services__NotificationApi: http://notification-api:8080
      Services__SocialApi: http://social-api:8080
      Seq__ServerUrl: http://seq:5341
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-api__Address: http://auth-api:8080
      ReverseProxy__Clusters__profile-cluster__Destinations__profile-api__Address: http://profile-api:8080
      ReverseProxy__Clusters__rating-cluster__Destinations__rating-api__Address: http://rating-api:8080
      ReverseProxy__Clusters__match-cluster__Destinations__match-api__Address: http://match-api:8080
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-api__Address: http://notification-api:8080
      ReverseProxy__Clusters__chat-cluster__Destinations__chat-api__Address: http://chat-api:8080
      ReverseProxy__Clusters__social-cluster__Destinations__social-api__Address: http://social-api:8080
    ports:
      - "5000:8080"
    depends_on:
      - auth-api
      - profile-api
      - rating-api
      - match-api
      - notification-api
      - chat-api
      - social-api
    networks:
      - comeback-network
    restart: on-failure

  auth-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: auth
        SERVICE_NAME: Auth
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-auth;Port=5432;Database=comeback_auth;Username=comeback;Password=${POSTGRES_PASSWORD:-comeback_dev}"
      JwtSettings__Secret: ${JWT_SECRET:-dev-secret-min-32-chars-comeback-auth-2026}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      JwtSettings__AccessTokenExpirationMinutes: "15"
      JwtSettings__RefreshTokenExpirationDays: "7"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-comeback_dev}
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5104:8080"
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - comeback-network
    restart: on-failure

  profile-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: profile
        SERVICE_NAME: Profile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-profile;Port=5432;Database=comeback_profile;Username=comeback;Password=${POSTGRES_PASSWORD:-comeback_dev}"
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      JwtSettings__Secret: ${JWT_SECRET:-dev-secret-min-32-chars-comeback-auth-2026}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-comeback_dev}
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5210:8080"
    depends_on:
      postgres-profile:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - comeback-network
    restart: on-failure

  match-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: match
        SERVICE_NAME: Match
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-match;Port=5432;Database=comeback_match;Username=comeback;Password=${POSTGRES_PASSWORD:-comeback_dev}"
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      JwtSettings__Secret: ${JWT_SECRET:-dev-secret-min-32-chars-comeback-auth-2026}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-comeback_dev}
      Services__RatingApi: http://rating-api:8080
      Services__ProfileApi: http://profile-api:8080
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5510:8080"
    depends_on:
      postgres-match:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile-api:
        condition: service_started
    networks:
      - comeback-network
    restart: on-failure

  chat-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: chat
        SERVICE_NAME: Chat
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__ProfileApi: http://profile-api:8080
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-chat;Port=5432;Database=comeback_chat;Username=comeback;Password=${POSTGRES_PASSWORD:-comeback_dev}"
      JwtSettings__Secret: ${JWT_SECRET:-dev-secret-min-32-chars-comeback-auth-2026}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Chat__EncryptionKey: ${CHAT_ENCRYPTION_KEY:-Q29tZWJhY2tDaGF0RW5jcnlwdGlvbktleTIwMjYhISE=}
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5610:8080"
    depends_on:
      postgres-chat:
        condition: service_healthy
    networks:
      - comeback-network
    restart: on-failure

  notification-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: notification
        SERVICE_NAME: Notification
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__ProfileApi: http://profile-api:8080
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-notification;Port=5432;Database=comeback_notification;Username=comeback;Password=${POSTGRES_PASSWORD:-comeback_dev}"
      JwtSettings__Secret: ${JWT_SECRET:-dev-secret-min-32-chars-comeback-auth-2026}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Smtp__Host: maildev
      Smtp__Port: "1025"
      Smtp__FromEmail: noreply@comeback.app
      Smtp__FromName: Comeback
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-comeback_dev}
      Frontend__BaseUrl: http://localhost:4200
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5410:8080"
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      maildev:
        condition: service_started
    networks:
      - comeback-network
    restart: on-failure

  social-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: social
        SERVICE_NAME: Social
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-social;Port=5432;Database=comeback_social;Username=comeback;Password=${POSTGRES_PASSWORD:-comeback_dev}"
      JwtSettings__Secret: ${JWT_SECRET:-dev-secret-min-32-chars-comeback-auth-2026}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-comeback_dev}
      Redis__ConnectionString: redis:6379
      Services__ProfileApi: http://profile-api:8080
      Services__MatchApi: http://match-api:8080
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5420:8080"
    depends_on:
      postgres-social:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      profile-api:
        condition: service_started
      match-api:
        condition: service_started
    networks:
      - comeback-network
    restart: on-failure

# ── Volumes ──────────────────────────────────────────────────

volumes:
  postgres-chat-data:
  postgres-auth-data:
  postgres-profile-data:
  postgres-match-data:
  postgres-notification-data:
  postgres-social-data:
  rabbitmq-data:
  redis-data:
  seq-data:

# ── Networks ─────────────────────────────────────────────────

networks:
  comeback-network:
    driver: bridge
