# Produkcijski compose. Pokretanje sa servera:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# VAŽNO: interni servisi (baze, rabbitmq, redis, seq, .NET servisi) NEMAJU
# published portove. Samo `web` (Caddy) izlazi na 80/443. Ovo je bezbednosno
# ključno jer Docker sam otvara portove u iptables i ZAOBILAZI ufw firewall.

services:

  # ── Baze podataka ────────────────────────────────────────────
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_auth
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-profile:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_profile
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - postgres-profile-data:/var/lib/postgresql/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_profile"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-rating:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_rating
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - postgres-rating-data:/var/lib/postgresql/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_rating"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-match:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_match
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - postgres-match-data:/var/lib/postgresql/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_match"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-chat:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_chat
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - postgres-chat-data:/var/lib/postgresql/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_notification
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_notification"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-social:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comeback_social
      POSTGRES_USER: comeback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - postgres-social-data:/var/lib/postgresql/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeback -d comeback_social"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Message broker / Cache / Logovi ──────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: comeback
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env.prod}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [comeback-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?set in .env.prod}
    volumes:
      - seq-data:/data
    networks: [comeback-network]
    restart: unless-stopped

  # ── .NET servisi ─────────────────────────────────────────────
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Cors__AllowedOrigins__0: https://${DOMAIN}
      Services__AuthApi: http://auth-api:8080
      Services__ProfileApi: http://profile-api:8080
      Services__RatingApi: http://rating-api:8080
      Services__MatchApi: http://match-api:8080
      Services__NotificationApi: http://notification-api:8080
      Services__SocialApi: http://social-api:8080
      Seq__ServerUrl: http://seq:5341
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-api__Address: http://auth-api:8080
      ReverseProxy__Clusters__profile-cluster__Destinations__profile-api__Address: http://profile-api:8080
      ReverseProxy__Clusters__rating-cluster__Destinations__rating-api__Address: http://rating-api:8080
      ReverseProxy__Clusters__match-cluster__Destinations__match-api__Address: http://match-api:8080
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-api__Address: http://notification-api:8080
      ReverseProxy__Clusters__chat-cluster__Destinations__chat-api__Address: http://chat-api:8080
      ReverseProxy__Clusters__social-cluster__Destinations__social-api__Address: http://social-api:8080
    depends_on: [auth-api, profile-api, rating-api, match-api, notification-api, chat-api, social-api]
    networks: [comeback-network]
    restart: unless-stopped

  auth-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE_DIR: auth, SERVICE_NAME: Auth }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-auth;Port=5432;Database=comeback_auth;Username=comeback;Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      JwtSettings__AccessTokenExpirationMinutes: "15"
      JwtSettings__RefreshTokenExpirationDays: "7"
      Cors__AllowedOrigins__0: https://${DOMAIN}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Seq__ServerUrl: http://seq:5341
    depends_on:
      postgres-auth: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [comeback-network]
    restart: unless-stopped

  profile-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE_DIR: profile, SERVICE_NAME: Profile }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-profile;Port=5432;Database=comeback_profile;Username=comeback;Password=${POSTGRES_PASSWORD}"
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Cors__AllowedOrigins__0: https://${DOMAIN}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Seq__ServerUrl: http://seq:5341
    depends_on:
      postgres-profile: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [comeback-network]
    restart: unless-stopped

  rating-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE_DIR: rating, SERVICE_NAME: Rating }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-rating;Port=5432;Database=comeback_rating;Username=comeback;Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Cors__AllowedOrigins__0: https://${DOMAIN}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Seq__ServerUrl: http://seq:5341
    depends_on:
      postgres-rating: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [comeback-network]
    restart: unless-stopped

  match-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE_DIR: match, SERVICE_NAME: Match }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-match;Port=5432;Database=comeback_match;Username=comeback;Password=${POSTGRES_PASSWORD}"
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Cors__AllowedOrigins__0: https://${DOMAIN}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Services__RatingApi: http://rating-api:8080
      Services__ProfileApi: http://profile-api:8080
      Seq__ServerUrl: http://seq:5341
    depends_on:
      postgres-match: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      profile-api: { condition: service_started }
    networks: [comeback-network]
    restart: unless-stopped

  chat-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE_DIR: chat, SERVICE_NAME: Chat }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-chat;Port=5432;Database=comeback_chat;Username=comeback;Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Cors__AllowedOrigins__0: https://${DOMAIN}
      Chat__EncryptionKey: ${CHAT_ENCRYPTION_KEY:?set in .env.prod}
      Services__ProfileApi: http://profile-api:8080
      Seq__ServerUrl: http://seq:5341
    depends_on:
      postgres-chat: { condition: service_healthy }
    networks: [comeback-network]
    restart: unless-stopped

  notification-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE_DIR: notification, SERVICE_NAME: Notification }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-notification;Port=5432;Database=comeback_notification;Username=comeback;Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Cors__AllowedOrigins__0: https://${DOMAIN}
      # Pravi SMTP (Brevo). Vrednosti u .env.prod
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: Comeback
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Services__ProfileApi: http://profile-api:8080
      Frontend__BaseUrl: https://${DOMAIN}
      Seq__ServerUrl: http://seq:5341
    depends_on:
      postgres-notification: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [comeback-network]
    restart: unless-stopped

  social-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE_DIR: social, SERVICE_NAME: Social }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-social;Port=5432;Database=comeback_social;Username=comeback;Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET:?set in .env.prod}
      JwtSettings__Issuer: comeback-auth
      JwtSettings__Audience: comeback-api
      Cors__AllowedOrigins__0: https://${DOMAIN}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: comeback
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Redis__ConnectionString: redis:6379
      Services__ProfileApi: http://profile-api:8080
      Services__MatchApi: http://match-api:8080
      Seq__ServerUrl: http://seq:5341
    depends_on:
      postgres-social: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      profile-api: { condition: service_started }
      match-api: { condition: service_started }
    networks: [comeback-network]
    restart: unless-stopped

  # ── Web: Angular SPA + Caddy (HTTPS, reverse proxy) ──────────
  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
    environment:
      DOMAIN: ${DOMAIN:?set in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]
    networks: [comeback-network]
    restart: unless-stopped

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres-auth-data:
  postgres-profile-data:
  postgres-rating-data:
  postgres-match-data:
  postgres-chat-data:
  postgres-notification-data:
  postgres-social-data:
  rabbitmq-data:
  redis-data:
  seq-data:
  caddy-data:
  caddy-config:

# ── Networks ─────────────────────────────────────────────────
networks:
  comeback-network:
    driver: bridge
